<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="8" stdDeviation="12" flood-color="#78350f" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Wooden / Creative Desk Texture -->
  <rect width="600" height="400" fill="#f8f5f0"/>

  <!-- Tilted Wireframe Sheet 1 -->
  <g transform="translate(80, 50) rotate(-8)" filter="url(#shadow4)">
    <rect x="0" y="0" width="220" height="290" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Wireframe content -->
    <rect x="20" y="20" width="180" height="24" rx="4" fill="#f1f5f9"/>
    <circle cx="34" cy="32" r="5" fill="#cbd5e1"/>
    <rect x="50" y="28" width="50" height="8" rx="4" fill="#cbd5e1"/>

    <!-- Wireframe Hero Block -->
    <rect x="20" y="56" width="180" height="90" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 4"/>
    <line x1="20" y1="56" x2="200" y2="146" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="20" y1="146" x2="200" y2="56" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="65" y="86" width="90" height="12" rx="4" fill="#64748b"/>
    <rect x="80" y="106" width="60" height="8" rx="4" fill="#94a3b8"/>
    <rect x="85" y="122" width="50" height="14" rx="7" fill="#0284c7"/>

    <!-- Wireframe Cards -->
    <rect x="20" y="160" width="85" height="100" rx="6" fill="#f1f5f9"/>
    <rect x="30" y="172" width="65" height="40" rx="4" fill="#cbd5e1"/>
    <rect x="30" y="220" width="50" height="8" rx="4" fill="#64748b"/>
    <rect x="30" y="234" width="40" height="6" rx="3" fill="#94a3b8"/>

    <rect x="115" y="160" width="85" height="100" rx="6" fill="#f1f5f9"/>
    <rect x="125" y="172" width="65" height="40" rx="4" fill="#cbd5e1"/>
    <rect x="125" y="220" width="50" height="8" rx="4" fill="#64748b"/>
    <rect x="125" y="234" width="40" height="6" rx="3" fill="#94a3b8"/>
  </g>

  <!-- Wireframe Sheet 2 (Overlapping) -->
  <g transform="translate(290, 40) rotate(5)" filter="url(#shadow4)">
    <rect x="0" y="0" width="240" height="310" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Sticky Notes -->
    <rect x="20" y="20" width="65" height="65" rx="4" fill="#fef08a" transform="rotate(-4 20 20)"/>
    <text x="28" y="44" fill="#854d0e" font-family="'Outfit', sans-serif" font-size="9" font-weight="700">User Flow</text>
    <line x1="28" y1="52" x2="68" y2="52" stroke="#ca8a04" stroke-width="2"/>
    <line x1="28" y1="60" x2="60" y2="60" stroke="#ca8a04" stroke-width="2"/>

    <rect x="95" y="20" width="65" height="65" rx="4" fill="#fed7aa" transform="rotate(3 95 20)"/>
    <text x="103" y="44" fill="#9a3412" font-family="'Outfit', sans-serif" font-size="9" font-weight="700">Persona</text>
    <line x1="103" y1="52" x2="145" y2="52" stroke="#ea580c" stroke-width="2"/>
    <line x1="103" y1="60" x2="135" y2="60" stroke="#ea580c" stroke-width="2"/>

    <!-- Mobile UI sketches -->
    <g transform="translate(25, 100)">
      <rect x="0" y="0" width="85" height="160" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <rect x="10" y="15" width="65" height="12" rx="4" fill="#cbd5e1"/>
      <rect x="10" y="34" width="65" height="45" rx="6" fill="#e2e8f0"/>
      <circle cx="42" cy="56" r="12" fill="#0284c7" opacity="0.3"/>
      <rect x="10" y="88" width="65" height="20" rx="4" fill="#f1f5f9"/>
      <rect x="10" y="115" width="65" height="20" rx="4" fill="#f1f5f9"/>
    </g>

    <g transform="translate(130, 100)">
      <rect x="0" y="0" width="85" height="160" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="42" cy="35" r="16" fill="#f43f5e" opacity="0.2"/>
      <rect x="15" y="60" width="55" height="8" rx="3" fill="#64748b"/>
      <rect x="20" y="74" width="45" height="6" rx="3" fill="#94a3b8"/>
      <rect x="10" y="95" width="65" height="45" rx="6" fill="#e2e8f0"/>
    </g>
  </g>

  <!-- Designer Pen / Stylus -->
  <g transform="translate(250, 220) rotate(42)" filter="url(#shadow4)">
    <rect x="0" y="0" width="12" height="160" rx="6" fill="#0f172a"/>
    <polygon points="0,0 12,0 6,-18" fill="#cbd5e1"/>
    <polygon points="4,-12 8,-12 6,-18" fill="#0f172a"/>
    <rect x="0" y="120" width="12" height="18" fill="#e2e8f0"/>
  </g>
</svg>
