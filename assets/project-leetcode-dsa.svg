<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="lc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="50%" stop-color="#282c34"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <filter id="shadow-lc" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#lc-bg)"/>

  <!-- Code editor mockup -->
  <g transform="translate(60, 30)" filter="url(#shadow-lc)">
    <rect x="0" y="0" width="480" height="290" rx="14" fill="#1e1e1e" stroke="#333" stroke-width="1.5"/>
    
    <!-- Top tab bar -->
    <rect x="0" y="0" width="480" height="34" rx="14" fill="#252526"/>
    <circle cx="18" cy="17" r="4.5" fill="#ff5f56"/>
    <circle cx="32" cy="17" r="4.5" fill="#ffbd2e"/>
    <circle cx="46" cy="17" r="4.5" fill="#27c93f"/>
    <text x="70" y="21" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="11">Solution.java — LeetCode (200-Day Streak 🔥)</text>

    <!-- Stats Banner -->
    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="135" height="55" rx="8" fill="#2d2d2d"/>
      <text x="14" y="22" fill="#9cdcfe" font-family="'Outfit', sans-serif" font-size="10">Problems Solved</text>
      <text x="14" y="44" fill="#facc15" font-family="'Outfit', sans-serif" font-size="18" font-weight="700">300+</text>

      <rect x="150" y="0" width="135" height="55" rx="8" fill="#2d2d2d"/>
      <text x="164" y="22" fill="#9cdcfe" font-family="'Outfit', sans-serif" font-size="10">Active Streak</text>
      <text x="164" y="44" fill="#ff79c6" font-family="'Outfit', sans-serif" font-size="18" font-weight="700">200 Days 🔥</text>

      <rect x="300" y="0" width="140" height="55" rx="8" fill="#2d2d2d"/>
      <text x="314" y="22" fill="#9cdcfe" font-family="'Outfit', sans-serif" font-size="10">Focus Areas</text>
      <text x="314" y="44" fill="#4ade80" font-family="'Outfit', sans-serif" font-size="13" font-weight="600">Trees, DP, Graphs</text>
    </g>

    <!-- Code Editor Body -->
    <g transform="translate(20, 118)">
      <rect x="0" y="0" width="440" height="152" rx="8" fill="#181818"/>
      <text x="14" y="24" fill="#569cd6" font-family="'JetBrains Mono', monospace" font-size="10">public class <tspan fill="#4ec9b0">Solution</tspan> {</text>
      <text x="28" y="44" fill="#569cd6" font-family="'JetBrains Mono', monospace" font-size="10">    public int[] <tspan fill="#dcdcaa">twoSum</tspan>(<tspan fill="#569cd6">int</tspan>[] nums, <tspan fill="#569cd6">int</tspan> target) {</text>
      <text x="42" y="64" fill="#569cd6" font-family="'JetBrains Mono', monospace" font-size="10">        Map&lt;<tspan fill="#4ec9b0">Integer</tspan>, <tspan fill="#4ec9b0">Integer</tspan>&gt; map = <tspan fill="#569cd6">new</tspan> HashMap&lt;&gt;();</text>
      <text x="42" y="84" fill="#569cd6" font-family="'JetBrains Mono', monospace" font-size="10">        <tspan fill="#c586c0">for</tspan> (<tspan fill="#569cd6">int</tspan> i = 0; i &lt; nums.length; i++) {</text>
      <text x="56" y="104" fill="#6a9955" font-family="'JetBrains Mono', monospace" font-size="10">            // Optimized O(N) Hash lookup &amp; memoization</text>
      <text x="42" y="124" fill="#569cd6" font-family="'JetBrains Mono', monospace" font-size="10">        }</text>
      <text x="14" y="142" fill="#569cd6" font-family="'JetBrains Mono', monospace" font-size="10">    }</text>
    </g>
  </g>
</svg>
