<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3b32"/>
      <stop offset="50%" stop-color="#2d221b"/>
      <stop offset="100%" stop-color="#19130f"/>
    </linearGradient>
    <linearGradient id="phone-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa709a"/>
      <stop offset="100%" stop-color="#fee140"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background scene -->
  <rect width="600" height="400" fill="url(#p1-bg)"/>
  <circle cx="120" cy="80" r="140" fill="#f59e0b" opacity="0.08"/>
  <circle cx="500" cy="320" r="160" fill="#ec4899" opacity="0.06"/>

  <!-- Subtle desk & hands aesthetic -->
  <ellipse cx="300" cy="380" rx="260" ry="80" fill="#140f0c" opacity="0.8"/>

  <!-- Phone Mockup Container -->
  <g transform="translate(195, 25)" filter="url(#shadow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="210" height="350" rx="36" fill="#1e1e1e" stroke="#444" stroke-width="4"/>
    <!-- Phone Screen -->
    <rect x="8" y="8" width="194" height="334" rx="28" fill="url(#phone-screen)"/>
    <!-- Dynamic Island / Notch -->
    <rect x="75" y="16" width="60" height="14" rx="7" fill="#000"/>
    <!-- Status icons -->
    <circle cx="178" cy="23" r="3" fill="#fff" opacity="0.8"/>
    
    <!-- App UI Header -->
    <text x="24" y="60" fill="#fff" font-family="'Outfit', sans-serif" font-size="13" font-weight="600">Total Portfolio</text>
    <text x="24" y="86" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="22" font-weight="700">$24,850.40</text>
    <rect x="135" y="70" width="50" height="20" rx="10" fill="#10b981" opacity="0.2"/>
    <text x="143" y="84" fill="#10b981" font-family="'Outfit', sans-serif" font-size="10" font-weight="700">+14.6%</text>

    <!-- Mini chart card -->
    <rect x="20" y="105" width="170" height="90" rx="16" fill="url(#card-grad)"/>
    <!-- Card details -->
    <text x="32" y="130" fill="#fff" font-family="'Outfit', sans-serif" font-size="11" font-weight="600">MasterCard Platinum</text>
    <text x="32" y="172" fill="#fff" font-family="'Outfit', sans-serif" font-size="13" letter-spacing="2">••••  8829</text>
    <circle cx="160" cy="130" r="10" fill="#fff" opacity="0.5"/>
    <circle cx="172" cy="130" r="10" fill="#fff" opacity="0.5"/>

    <!-- Quick Actions -->
    <g transform="translate(24, 210)">
      <rect x="0" y="0" width="36" height="36" rx="12" fill="#243447"/>
      <path d="M18 10v16M10 18h16" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
      <rect x="46" y="0" width="36" height="36" rx="12" fill="#243447"/>
      <path d="M64 12l-6 6h12l-6-6zM64 24l6-6H58l6 6z" fill="#ec4899"/>
      <rect x="92" y="0" width="36" height="36" rx="12" fill="#243447"/>
      <circle cx="110" cy="18" r="6" stroke="#f59e0b" stroke-width="2" fill="none"/>
      <rect x="138" y="0" width="36" height="36" rx="12" fill="#243447"/>
      <circle cx="156" cy="14" r="2" fill="#fff"/>
      <circle cx="156" cy="18" r="2" fill="#fff"/>
      <circle cx="156" cy="22" r="2" fill="#fff"/>
    </g>

    <!-- Recent Transactions -->
    <text x="24" y="270" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="11" font-weight="600">Recent Activity</text>
    <rect x="20" y="282" width="170" height="36" rx="10" fill="#1e293b"/>
    <circle cx="38" cy="300" r="9" fill="#00f2fe" opacity="0.2"/>
    <text x="34" y="304" fill="#00f2fe" font-size="11" font-weight="bold">⚡</text>
    <text x="54" y="298" fill="#fff" font-family="'Outfit', sans-serif" font-size="10" font-weight="600">Apple Store UK</text>
    <text x="54" y="310" fill="#64748b" font-family="'Outfit', sans-serif" font-size="9">Technology</text>
    <text x="140" y="303" fill="#f43f5e" font-family="'Outfit', sans-serif" font-size="10" font-weight="700">-$249.00</text>
  </g>
</svg>
