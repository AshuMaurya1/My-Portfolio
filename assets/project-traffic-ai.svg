<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="tf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="tf-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow-tf" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#tf-bg)"/>

  <!-- City Traffic Grid Intersection Wireframe -->
  <g opacity="0.35">
    <line x1="0" y1="180" x2="600" y2="180" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="220" x2="600" y2="220" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="200" x2="600" y2="200" stroke="#facc15" stroke-width="2" stroke-dasharray="8 8"/>
    <line x1="260" y1="0" x2="260" y2="400" stroke="#334155" stroke-width="2"/>
    <line x1="340" y1="0" x2="340" y2="400" stroke="#334155" stroke-width="2"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="#facc15" stroke-width="2" stroke-dasharray="8 8"/>
  </g>

  <!-- Dashboard Container -->
  <g transform="translate(45, 30)" filter="url(#shadow-tf)">
    <!-- Main Window Frame -->
    <rect x="0" y="0" width="510" height="280" rx="14" fill="#0b1120" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Window Bar -->
    <rect x="0" y="0" width="510" height="34" rx="14" fill="#1e293b"/>
    <circle cx="20" cy="17" r="5" fill="#ef4444"/>
    <circle cx="36" cy="17" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="17" r="5" fill="#10b981"/>
    <text x="210" y="22" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="11" font-weight="600">AI Traffic Controller • FastAPI / XGBoost</text>

    <!-- Left Stats Panel -->
    <rect x="18" y="48" width="145" height="70" rx="10" fill="#1e293b"/>
    <text x="30" y="70" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="10">Congestion Index</text>
    <text x="30" y="96" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="22" font-weight="700">78.4%</text>
    <rect x="105" y="80" width="45" height="18" rx="9" fill="#ef4444" opacity="0.2"/>
    <text x="111" y="93" fill="#ef4444" font-family="'Outfit', sans-serif" font-size="9" font-weight="700">HIGH</text>

    <rect x="18" y="126" width="145" height="70" rx="10" fill="#1e293b"/>
    <text x="30" y="148" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="10">Signal Phase</text>
    <text x="30" y="174" fill="#10b981" font-family="'Outfit', sans-serif" font-size="18" font-weight="700">Adaptive (45s)</text>
    <text x="30" y="188" fill="#64748b" font-family="'Outfit', sans-serif" font-size="9">Dynamic adjustment active</text>

    <!-- Center Traffic Signal Simulation Visualizer -->
    <rect x="175" y="48" width="195" height="148" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1"/>
    <!-- Intersection Graphic -->
    <line x1="175" y1="122" x2="370" y2="122" stroke="#374151" stroke-width="24"/>
    <line x1="272" y1="48" x2="272" y2="196" stroke="#374151" stroke-width="24"/>
    <!-- Traffic lights representation -->
    <circle cx="255" cy="105" r="5" fill="#ef4444"/>
    <circle cx="289" cy="105" r="5" fill="#10b981"/>
    <circle cx="255" cy="139" r="5" fill="#10b981"/>
    <circle cx="289" cy="139" r="5" fill="#ef4444"/>
    <!-- Vehicles -->
    <rect x="200" y="117" width="14" height="8" rx="2" fill="#38bdf8"/>
    <rect x="220" y="117" width="14" height="8" rx="2" fill="#38bdf8"/>
    <rect x="268" y="65" width="8" height="14" rx="2" fill="#facc15"/>

    <!-- Right Live ML Metrics -->
    <rect x="382" y="48" width="112" height="148" rx="10" fill="#1e293b"/>
    <text x="394" y="70" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="10" font-weight="600">Model Metrics</text>
    <text x="394" y="90" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="9">Random Forest</text>
    <rect x="394" y="96" width="88" height="6" rx="3" fill="#334155"/>
    <rect x="394" y="96" width="82" height="6" rx="3" fill="#10b981"/>
    
    <text x="394" y="122" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="9">XGBoost Acc.</text>
    <rect x="394" y="128" width="88" height="6" rx="3" fill="#334155"/>
    <rect x="394" y="128" width="84" height="6" rx="3" fill="#38bdf8"/>

    <text x="394" y="154" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="9">Wait Time Red.</text>
    <text x="394" y="174" fill="#10b981" font-family="'Outfit', sans-serif" font-size="15" font-weight="700">-34.2%</text>

    <!-- Bottom Chart Line -->
    <rect x="18" y="206" width="476" height="60" rx="8" fill="#1e293b"/>
    <path d="M30 248 Q 120 220 200 240 T 360 225 T 480 232" fill="none" stroke="url(#tf-glow)" stroke-width="3"/>
    <circle cx="480" cy="232" r="4" fill="#38bdf8"/>
  </g>
</svg>
