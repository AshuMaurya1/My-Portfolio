<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="va-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b2b"/>
      <stop offset="50%" stop-color="#2d1254"/>
      <stop offset="100%" stop-color="#0f071d"/>
    </linearGradient>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow-va" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#va-bg)"/>

  <!-- Ambient audio glow circles -->
  <circle cx="300" cy="180" r="140" fill="#c026d3" opacity="0.12"/>
  <circle cx="300" cy="180" r="90" fill="#f43f5e" opacity="0.18"/>

  <!-- Voice Assistant Interface Card -->
  <g transform="translate(110, 35)" filter="url(#shadow-va)">
    <!-- Device Frame -->
    <rect x="0" y="0" width="380" height="320" rx="24" fill="#140924" stroke="#4c1d95" stroke-width="2"/>
    
    <!-- Top status bar -->
    <rect x="25" y="24" width="70" height="22" rx="11" fill="#2e1065"/>
    <circle cx="37" cy="35" r="4" fill="#10b981"/>
    <text x="46" y="39" fill="#10b981" font-family="'Outfit', sans-serif" font-size="10" font-weight="700">ONLINE</text>
    <text x="250" y="39" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="10">Web Speech API</text>

    <!-- Speech recognition text prompt -->
    <rect x="25" y="60" width="330" height="52" rx="14" fill="#24103e"/>
    <text x="40" y="82" fill="#e2e8f0" font-family="'Outfit', sans-serif" font-size="12" font-weight="600">"Hey Assistant, open GitHub and play music"</text>
    <text x="40" y="98" fill="#a855f7" font-family="'Outfit', sans-serif" font-size="10">Latency: 280ms • Accuracy: 98%</text>

    <!-- Center Pulsing Microphone Graphic -->
    <circle cx="190" cy="175" r="42" fill="url(#wave-grad)"/>
    <circle cx="190" cy="175" r="54" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.4"/>
    <circle cx="190" cy="175" r="66" fill="none" stroke="#c026d3" stroke-width="1.5" opacity="0.25"/>
    
    <!-- Microphone Icon -->
    <rect x="184" y="160" width="12" height="20" rx="6" fill="#ffffff"/>
    <path d="M178 172 C 178 184, 202 184, 202 172" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <line x1="190" y1="184" x2="190" y2="192" stroke="#ffffff" stroke-width="3"/>
    <line x1="182" y1="192" x2="198" y2="192" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    <!-- Dynamic Audio Waveform Equalizer -->
    <g transform="translate(40, 245)">
      <rect x="10" y="16" width="6" height="20" rx="3" fill="#38bdf8"/>
      <rect x="24" y="8" width="6" height="36" rx="3" fill="#38bdf8"/>
      <rect x="38" y="0" width="6" height="52" rx="3" fill="#c026d3"/>
      <rect x="52" y="10" width="6" height="32" rx="3" fill="#f43f5e"/>
      <rect x="66" y="2" width="6" height="48" rx="3" fill="#c026d3"/>
      <rect x="80" y="18" width="6" height="16" rx="3" fill="#38bdf8"/>
      <rect x="94" y="6" width="6" height="40" rx="3" fill="#c026d3"/>
      <rect x="108" y="0" width="6" height="52" rx="3" fill="#f43f5e"/>
      <rect x="122" y="14" width="6" height="24" rx="3" fill="#38bdf8"/>
      <rect x="136" y="2" width="6" height="48" rx="3" fill="#c026d3"/>
      <rect x="150" y="12" width="6" height="28" rx="3" fill="#f43f5e"/>
      <rect x="164" y="4" width="6" height="44" rx="3" fill="#c026d3"/>
      <rect x="178" y="18" width="6" height="16" rx="3" fill="#38bdf8"/>
      <rect x="192" y="0" width="6" height="52" rx="3" fill="#f43f5e"/>
      <rect x="206" y="8" width="6" height="36" rx="3" fill="#c026d3"/>
      <rect x="220" y="16" width="6" height="20" rx="3" fill="#38bdf8"/>
      <rect x="234" y="2" width="6" height="48" rx="3" fill="#f43f5e"/>
      <rect x="248" y="12" width="6" height="28" rx="3" fill="#c026d3"/>
      <rect x="262" y="4" width="6" height="44" rx="3" fill="#38bdf8"/>
      <rect x="276" y="18" width="6" height="16" rx="3" fill="#c026d3"/>
      <rect x="290" y="10" width="6" height="32" rx="3" fill="#38bdf8"/>
    </g>
  </g>
</svg>
