<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#1a252f"/>
    </linearGradient>
    <linearGradient id="map-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#p2-bg)"/>

  <!-- Background decorative grid -->
  <path d="M0 80h600M0 160h600M0 240h600M0 320h600M100 0v400M200 0v400M300 0v400M400 0v400M500 0v400" stroke="#334155" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>

  <!-- Left Phone (Angled) -->
  <g transform="translate(130, 45) rotate(-6)" filter="url(#shadow2)">
    <rect x="0" y="0" width="170" height="300" rx="30" fill="#111" stroke="#475569" stroke-width="3"/>
    <rect x="6" y="6" width="158" height="288" rx="24" fill="url(#map-grad)"/>
    <!-- Top notch -->
    <rect x="60" y="12" width="50" height="10" rx="5" fill="#000"/>
    <!-- Map Streets -->
    <path d="M10 70 Q 80 90 150 50" stroke="#38bdf8" stroke-width="4" fill="none" opacity="0.6"/>
    <path d="M40 20 Q 70 140 130 250" stroke="#10b981" stroke-width="5" fill="none"/>
    <path d="M120 40 L 40 260" stroke="#64748b" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
    <!-- Destination Pin -->
    <circle cx="128" cy="246" r="10" fill="#ef4444"/>
    <circle cx="128" cy="246" r="4" fill="#fff"/>
    <!-- Current location -->
    <circle cx="42" cy="24" r="8" fill="#38bdf8"/>
    <circle cx="42" cy="24" r="16" fill="#38bdf8" opacity="0.3"/>
    <!-- Card overlay -->
    <rect x="16" y="220" width="138" height="56" rx="12" fill="#1e293b" opacity="0.95"/>
    <text x="26" y="240" fill="#fff" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">Central Station</text>
    <text x="26" y="256" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="9">12 mins • 4.2 km</text>
    <rect x="112" y="232" width="32" height="24" rx="8" fill="#10b981"/>
    <text x="122" y="248" fill="#fff" font-size="12">➔</text>
  </g>

  <!-- Right Phone (Forward) -->
  <g transform="translate(290, 30)" filter="url(#shadow2)">
    <rect x="0" y="0" width="180" height="320" rx="32" fill="#111" stroke="#64748b" stroke-width="3"/>
    <rect x="6" y="6" width="168" height="308" rx="26" fill="#0f172a"/>
    <rect x="65" y="14" width="50" height="12" rx="6" fill="#000"/>

    <!-- Search Bar -->
    <rect x="18" y="38" width="144" height="32" rx="16" fill="#1e293b"/>
    <circle cx="34" cy="54" r="6" stroke="#94a3b8" stroke-width="2" fill="none"/>
    <text x="46" y="58" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="10">Search destination...</text>

    <!-- Map representation -->
    <rect x="18" y="80" width="144" height="130" rx="14" fill="#1e293b"/>
    <circle cx="90" cy="145" r="45" fill="#0284c7" opacity="0.15"/>
    <path d="M30 110 L 80 145 L 140 120 L 150 190" stroke="#06b6d4" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="80" cy="145" r="8" fill="#f43f5e"/>
    <circle cx="80" cy="145" r="3" fill="#fff"/>
    <circle cx="140" cy="120" r="6" fill="#eab308"/>

    <!-- Bottom Route Card -->
    <rect x="18" y="222" width="144" height="80" rx="14" fill="#1e293b"/>
    <text x="28" y="244" fill="#fff" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">Turn right in 200m</text>
    <text x="28" y="258" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="9">King's Cross Boulevard</text>
    <rect x="28" y="268" width="124" height="24" rx="8" fill="#0284c7"/>
    <text x="64" y="284" fill="#fff" font-family="'Outfit', sans-serif" font-size="10" font-weight="600">Start Navigation</text>
  </g>
</svg>
